<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- 
        <meta charset="UTF-8"> : mengatur jenis huruf/karakter yang dipakai
    -->
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 
        <meta name="viewport"> : mengatur tampilan di HP
    -->
    
    <title>ian</title>
    <!-- 
        <title> : judul yang muncul di TAB browser
    -->

     <link rel="shortcut icon" href="meng.jpg" type="image/x-icon">
    <link rel="icon" href="meng.jpg" type="image/x-icon">
    
    <style>
        /* biar tampilannya konsisten antara Home dan Contact */
        
        /* ini untuk mengatur style seluruh halaman */
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        /* ini untuk membuat kotak putih di tengah */
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        /* ini untuk navigasi menu */
        nav {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ddd;
        }
        
        /* style link di navigasi */
        nav a {
            margin: 0 10px;
            text-decoration: none;
            color: #6c5a9c;
            font-weight: bold;
        }
        
        /* efek saat mouse di atas link */
        nav a:hover {
            color: #001aff;
            text-decoration: underline;
        }
        
        /* style untuk judul halaman */
        h1 {
            color: #6c5a9c;
            text-align: center;
            margin-bottom: 20px;
        }
        
        /* style untuk form */
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #333;
        }
        
        input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: Arial;
            box-sizing: border-box;
        }
        
        /* style tombol kirim */
        .btn-kirim {
            background-color: #6c5a9c;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }
        
        .btn-kirim:hover {
            background-color: #001aff;
        }
        
        /* style untuk info kontak tambahan */
        .info-kontak {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            margin-top: 25px;
            text-align: center;
        }
        
        /* style footer */
        footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            color: #777;
            font-size: 14px;
        }
        
        hr {
            margin: 20px 0;
            border: none;
            height: 1px;
            background-color: #ddd;
        }
    </style>
</head>

<body>

<!-- ini wadah utama / kotak putih pembungkus semua konten -->
<div class="container">

    <!-- ==================== BAGIAN NAVIGASI ==================== -->
    <!-- 
        <nav> : menu navigasi
        SAMA PERSIS dengan halaman Home
    -->
    <nav>
        <a href="index.html">Home</a>     
        <a href="cv2.pdf">Download CV</a> 
        <a href="contact.html">Contact</a>    
        <a href="about.html">About me</a>     
    </nav>

    <!-- garis pemisah -->
    <hr />

    <!-- ==================== BAGIAN FORM KONTAK ==================== -->
    <!-- 
        <h1> : judul halaman Contact
    -->
    <h1>Contact Me</h1>
    
    <!-- 
        <form> : wadah form
    -->
    <form action="#" method="post">
        
        <!-- div untuk mengelompokkan email + label -->
        <div class="form-group">
            <label for="email">Email:</label>
            <!-- 
                <input type="email"> : input khusus email
                required : wajib diisi
                placeholder : contoh teks
            -->
            <input type="email" 
                   name="email" 
                   id="email" 
                   placeholder="contoh: kessarioktaviani@email.com" 
                   required>
        </div>
        
        <!-- div untuk mengelompokkan pesan + label -->
        <div class="form-group">
            <label for="message">Pesan:</label>
            <!-- 
                <textarea> : input teks multi baris
                rows="5" : tinggi 5 baris
            -->
            <textarea name="message" 
                      id="message" 
                      placeholder="Tulis pesan anda di sini..." 
                      rows="5" 
                      required></textarea>
        </div>
        
        <!-- tombol kirim -->
        <input type="submit" value="Kirim Pesan" class="btn-kirim">
        
    </form>
    
    <!-- ==================== INFORMASI KONTAK TAMBAHAN ==================== -->
    <!-- 
        ini bagian info tambahan (Instagram, nomor, dll)
        stylenya dibuat mirip dengan card/artikel di halaman Home
    -->
    <hr />

    <!-- ==================== FOOTER ==================== -->
    <!-- 
        <footer> : bagian kaki halaman
        SAMA PERSIS dengan halaman Home
    -->
    <footer>
        <p>Copyright © 2026 vian. </p>
    </footer>
    
</div>

</body>
</html>
